# Phase 1 walking skeleton (docs/adr/0001-architecture-baseline.md).
# Run from the repo root: docker compose -f infra/compose/docker-compose.yml --env-file .env up
name: baltic-vessel-tracker

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baltic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baltic}
      POSTGRES_DB: ${POSTGRES_DB:-baltic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baltic}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host-side port moved off the 5432 default since it's commonly
      # already taken (another Postgres instance, another container).
      # Nothing in this stack needs to reach it from outside Docker;
      # this is only for an optional local DB client.
      - "127.0.0.1:15432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # On a fresh volume, Postgres briefly starts a temporary internal server
    # to run initdb before restarting as the real one. `pg_isready` (our
    # healthcheck) can report healthy against that temporary instance right
    # before the restart, so `depends_on: service_healthy` alone isn't
    # reliable here. Retry the real TCP connection ourselves before running
    # migrations, instead of relying on that healthcheck being race-free.
    command: >
      sh -c "
      until python -c \"import socket; socket.create_connection(('postgres', 5432), timeout=2).close()\" 2>/dev/null; do
        echo 'Waiting for postgres to accept connections...';
        sleep 2;
      done;
      alembic upgrade head
      "
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-baltic}:${POSTGRES_PASSWORD:-baltic}@postgres:5432/${POSTGRES_DB:-baltic}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-baltic}:${POSTGRES_PASSWORD:-baltic}@postgres:5432/${POSTGRES_DB:-baltic}
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-ingest:
    build:
      context: ../..
      dockerfile: workers/ingest/Dockerfile
    restart: unless-stopped
    # Pinned so source_status.instance (default: $HOSTNAME) stays stable
    # across rebuilds/recreates -- otherwise Docker assigns a new random
    # hostname to every recreated container, and each one permanently
    # orphans its old source_status row instead of updating it (they never
    # get another heartbeat, so they sit "degraded" forever). Single
    # instance today; if this ever scales to multiple ingest workers, give
    # each replica its own explicit hostname instead of removing this.
    hostname: worker-ingest
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-baltic}:${POSTGRES_PASSWORD:-baltic}@postgres:5432/${POSTGRES_DB:-baltic}
      REDIS_URL: redis://redis:6379/0
      # Which adapter(s) run (simulator/aisstream, API key, bounding
      # boxes) is configured from Admin -> Data sources in the app, not
      # env vars -- see workers/ingest/worker/sources.py.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Configurable since 8080 is a very commonly already-taken port on a
      # machine running other self-hosted services (hit this on a NAS
      # already running Unifi Network Application on 8080).
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - api

  # Optional: enable with `--profile proxy` once a real domain/TLS cert is
  # configured for self-hosting. Disabled by default (PRD SS16.1).
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
