name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements-dev.txt
        working-directory: apps/api
      - run: ruff check .
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api

  worker:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r workers/ingest/requirements-dev.txt
        working-directory: workers/ingest
      - run: ruff check .
        working-directory: workers/ingest
      - run: pytest -q
        working-directory: workers/ingest
        env:
          TEST_REDIS_URL: redis://localhost:6379/0

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
        working-directory: apps/web
      - run: npx eslint .
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Write test .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=baltic
          POSTGRES_PASSWORD=baltic-ci-password
          POSTGRES_DB=baltic
          BOOTSTRAP_ADMIN_EMAIL=admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password
          INGEST_ADAPTER=simulator
          COOKIE_SECURE=false
          EOF
      - name: Build and start the stack
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env up -d --build
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/health/ready | grep -q '"status":\s*"ok"'; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "API never became ready"; exit 1
      - name: Confirm the simulator pipeline reaches the database
        run: |
          for i in $(seq 1 30); do
            count=$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
              psql -U baltic -d baltic -tA -c "SELECT count(*) FROM vessel_latest;" || echo 0)
            if [ "$count" -gt 0 ] 2>/dev/null; then
              echo "vessel_latest has $count rows"; exit 0
            fi
            sleep 2
          done
          echo "No simulated vessel data reached the database"; exit 1
      - name: Confirm the viewport query actually works (exercises PostGIS geometry functions)
        run: |
          curl -sf -c cookies.txt -X POST http://localhost:8090/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password"}' > /dev/null
          status=$(curl -s -o response.json -w '%{http_code}' -b cookies.txt \
            'http://localhost:8090/api/v1/vessels?min_lon=10&min_lat=54&max_lon=25&max_lat=66')
          cat response.json
          if [ "$status" != "200" ]; then
            echo "Expected 200 from /api/v1/vessels, got $status"; exit 1
          fi
      - name: Confirm watchlist CRUD works end to end (exercises the same PostGIS join pattern)
        run: |
          csrf=$(awk -F'\t' '$6 == "bvt_csrf" {print $7}' cookies.txt)
          mmsi=$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U baltic -d baltic -tA -c "SELECT mmsi FROM vessel_latest LIMIT 1;" | tr -d '\r')

          create_status=$(curl -s -o create.json -w '%{http_code}' -b cookies.txt -X POST \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            -d '{"name":"CI Test List"}' http://localhost:8090/api/v1/watchlists)
          cat create.json
          [ "$create_status" = "200" ] || { echo "create watchlist failed: $create_status"; exit 1; }
          watchlist_id=$(python3 -c "import json; print(json.load(open('create.json'))['id'])")

          add_status=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -X PUT \
            -H "X-CSRF-Token: $csrf" \
            "http://localhost:8090/api/v1/watchlists/$watchlist_id/vessels/$mmsi")
          [ "$add_status" = "204" ] || { echo "add vessel failed: $add_status"; exit 1; }

          detail_status=$(curl -s -o detail.json -w '%{http_code}' -b cookies.txt \
            "http://localhost:8090/api/v1/watchlists/$watchlist_id")
          cat detail.json
          [ "$detail_status" = "200" ] || { echo "get watchlist failed: $detail_status"; exit 1; }
          python3 -c "
          import json
          data = json.load(open('detail.json'))
          mmsis = [v['mmsi'] for v in data['vessels']]
          assert '$mmsi' in mmsis, f'{\"$mmsi\"} not in {mmsis}'
          "
      - name: Confirm the track endpoint works (exercises the same PostGIS cast pattern again)
        run: |
          mmsi=$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U baltic -d baltic -tA -c "SELECT mmsi FROM position_observations LIMIT 1;" | tr -d '\r')
          status=$(curl -s -o track.json -w '%{http_code}' -b cookies.txt \
            "http://localhost:8090/api/v1/vessels/$mmsi/track")
          cat track.json
          [ "$status" = "200" ] || { echo "track query failed: $status"; exit 1; }
          python3 -c "
          import json
          data = json.load(open('track.json'))
          assert 'segments' in data and isinstance(data['segments'], list)
          "
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
